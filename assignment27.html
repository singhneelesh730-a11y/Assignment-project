.card {
    padding: 20px;
    margin: 12px;
    border-radius: 12px;
}

.card-one {
    background: white;
    border: 1px solid #ccc;
}

.card-two {
    background: #fff3bf;
    border: 2px solid #f0b429;
    border-radius: 20px;
}

.card-three {
    background: #1d3557;
    color: white;
    border-radius: 6px;
}
