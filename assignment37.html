<div class="product-grid">
    <article class="item">Product A</article>
    <article class="item">Product B</article>
    <article class="item">Product C</article>
    <article class="item">Product D</article>
</div>


.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.item {
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: white;
}
